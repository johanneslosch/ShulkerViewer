name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Read mod version
        id: version
        run: echo "mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.run_number }}
          VERSION: ${{ steps.version.outputs.mod_version }}
        run: |
          gh release create "$TAG" \
            "build/libs/ShulkerViewer-${VERSION}.jar" \
            "build/libs/ShulkerViewer-${VERSION}-sources.jar" \
            --target "$GITHUB_SHA" \
            --title "ShulkerViewer ${VERSION} (build ${{ github.run_number }})" \
            --generate-notes

      - name: Upload to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3.2
        with:
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: build/libs/ShulkerViewer-${{ steps.version.outputs.mod_version }}.jar
          name: ShulkerViewer ${{ steps.version.outputs.mod_version }} (build ${{ github.run_number }})
          version: ${{ steps.version.outputs.mod_version }}+build.${{ github.run_number }}
          version-type: alpha
          loaders: fabric
          game-versions: "26.3"
          dependencies: fabric-api(required)
          changelog: Automated build ${{ github.run_number }} from ${{ github.sha }}
