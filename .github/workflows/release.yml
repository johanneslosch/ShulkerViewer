name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Read mod version
        id: version
        run: echo "mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.run_number }}
          VERSION: ${{ steps.version.outputs.mod_version }}
        run: |
          gh release create "$TAG" \
            "build/libs/ShulkerViewer-${VERSION}.jar" \
            "build/libs/ShulkerViewer-${VERSION}-sources.jar" \
            --target "$GITHUB_SHA" \
            --title "ShulkerViewer ${VERSION} (build ${{ github.run_number }})" \
            --generate-notes
